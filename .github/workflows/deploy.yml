name: Deploy to AWS Amplify
run-name: Deploy production from main by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amplify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check deployment configuration
        run: node scripts/deploy-amplify.cjs check
      - name: Run tests
        run: npm test
      - name: Build the site
        run: npm run build
      - name: Obtain temporary AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: mac-web-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
      - name: Deploy and wait for Amplify
        timeout-minutes: 25
        run: node scripts/deploy-amplify.cjs deploy
      - name: Remove approval and stop unfinished deployment
        if: always() && steps.aws.outcome == 'success'
        timeout-minutes: 3
        run: node scripts/deploy-amplify.cjs cleanup
