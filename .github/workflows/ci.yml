name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      live_prod_checks:
        description: Run read-only mobile checks against the deployed production site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build (Node 24)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 # v1.65.1-noble
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript types
        run: npm run check
      - name: Run syntax and regression tests
        run: npm test
      - name: Check mobile form, consent and CSP in Chromium and WebKit
        env:
          MAC_LIVE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.live_prod_checks && 'true' || 'false' }}
        run: npm run test:browser
      - name: Preserve browser diagnostics
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.live_prod_checks)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-browser-diagnostics
          path: test-results/
          retention-days: 7
      - name: Verify generated backend security
        env:
          CONTACT_EMAIL: owner@example.test
          CONTACT_ENABLED: 'false'
          AWS_APP_ID: testapp
          CONTACT_API_ID: testapi123
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-east-2
          CDK_OUTDIR: .amplify/artifacts/security-synth
          CDK_CONTEXT_JSON: '{"amplify-backend-name":"main","amplify-backend-namespace":"testapp","amplify-backend-type":"branch"}'
        run: |
          node --import tsx amplify/backend.ts
          node scripts/check-synth-security.ts .amplify/artifacts/security-synth
      - name: Build static files and license notices
        run: npm run build
      - name: Validate CloudFormation template
        run: |
          if ! python3 -c 'import venv, ensurepip' >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends python3-venv
          fi
          python3 -m venv "$RUNNER_TEMP/cfn-lint"
          "$RUNNER_TEMP/cfn-lint/bin/python" -m pip install --disable-pip-version-check cfn-lint==1.60.1
          "$RUNNER_TEMP/cfn-lint/bin/cfn-lint" infra/*.yaml
          "$RUNNER_TEMP/cfn-lint/bin/python" tests/deployment-security.test.py
      - name: Check tracked source stays unchanged
        run: git diff --exit-code
