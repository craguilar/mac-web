AWSTemplateFormatVersion: '2010-09-09'
Description: 'MAC contact prerequisites: verified SES domain, fixed HTTP API and scoped deployment permissions.'
Parameters:
  AmplifyAppId:
    Type: String
    AllowedPattern: '[a-z0-9]+'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public hosted zone for mactecnologia.com.mx
  ContactEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '[^\s@]+@[^\s@]+\.[^\s@]+'
    Description: Private fixed recipient; never include in browser assets or repository.
Resources:
  SenderDomain:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: mactecnologia.com.mx
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
  SenderDkim:
    Type: AWS::Route53::RecordSetGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !GetAtt SenderDomain.DkimDNSTokenName1
          Type: CNAME
          TTL: '300'
          ResourceRecords: [!GetAtt SenderDomain.DkimDNSTokenValue1]
        - Name: !GetAtt SenderDomain.DkimDNSTokenName2
          Type: CNAME
          TTL: '300'
          ResourceRecords: [!GetAtt SenderDomain.DkimDNSTokenValue2]
        - Name: !GetAtt SenderDomain.DkimDNSTokenName3
          Type: CNAME
          TTL: '300'
          ResourceRecords: [!GetAtt SenderDomain.DkimDNSTokenValue3]
  AmplifyBackendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: amplify.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnEquals:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}
      Policies:
      - PolicyName: MacContactDeployment
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sts:AssumeRole
            - sts:TagSession
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-deploy-role-${AWS::AccountId}-${AWS::Region}
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-file-publishing-role-${AWS::AccountId}-${AWS::Region}
          - Effect: Allow
            Action:
            - cloudformation:DescribeStacks
            - cloudformation:DescribeStackEvents
            - cloudformation:DescribeStackResources
            - cloudformation:DescribeStackResource
            - cloudformation:GetTemplate
            - cloudformation:GetTemplateSummary
            - cloudformation:ListStackResources
            - cloudformation:DescribeChangeSet
            - cloudformation:ListChangeSets
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/amplify-${AmplifyAppId}-main-*/*
            - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/CDKToolkit/*
          - Effect: Allow
            Action:
            - cloudformation:ListStacks
            Resource:
            - '*'
          - Effect: Allow
            Action:
            - ssm:GetParameter
            - ssm:GetParameters
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/hnb659fds/version
            - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amplify/${AmplifyAppId}/main-branch-*/TURNSTILE_SECRET_KEY
            - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amplify/shared/${AmplifyAppId}/TURNSTILE_SECRET_KEY
          - Effect: Allow
            Action:
            - amplify:GetApp
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}
          - Effect: Allow
            Action:
            - amplify:GetBranch
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/main
  ContactApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: mac-web-${AmplifyAppId}-contact
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
        - https://mactecnologia.com.mx
        - https://www.mactecnologia.com.mx
        AllowMethods:
        - POST
        AllowHeaders:
        - content-type
        MaxAge: 3600
      Tags:
        amplify:app-id:
          Ref: AmplifyAppId
  ContactStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: ContactApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 0.1
  RuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: mac-web-${AmplifyAppId}-runtime-boundary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - ses:SendEmail
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/mactecnologia.com.mx
          Condition:
            StringEquals:
              ses:FromAddress: web@mactecnologia.com.mx
            ForAllValues:StringEquals:
              ses:Recipients:
              - Ref: ContactEmail
        - Effect: Allow
          Action:
          - ssm:GetParameters
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amplify/${AmplifyAppId}/main-branch-*/TURNSTILE_SECRET_KEY
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amplify/shared/${AmplifyAppId}/TURNSTILE_SECRET_KEY
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/amplify-${AmplifyAppId}-*
        - Effect: Allow
          Action:
          - amplify:GetBranch
          - amplify:UpdateBranch
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/main
        - Effect: Allow
          Action:
          - lambda:InvokeFunction
          - lambda:GetFunction
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:amplify-${AmplifyAppId}-*
  DeploymentExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: mac-web-${AmplifyAppId}-deployment
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - cloudformation:DescribeStacks
          - cloudformation:DescribeStackEvents
          - cloudformation:DescribeStackResources
          - cloudformation:DescribeStackResource
          - cloudformation:GetTemplate
          - cloudformation:GetTemplateSummary
          - cloudformation:ListStackResources
          - cloudformation:DescribeChangeSet
          - cloudformation:ListChangeSets
          - cloudformation:CreateStack
          - cloudformation:UpdateStack
          - cloudformation:DeleteStack
          - cloudformation:CreateChangeSet
          - cloudformation:DeleteChangeSet
          - cloudformation:ExecuteChangeSet
          - cloudformation:RollbackStack
          - cloudformation:ContinueUpdateRollback
          - cloudformation:UpdateTerminationProtection
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/amplify-${AmplifyAppId}-main-*/*
        - Effect: Allow
          Action:
          - lambda:CreateFunction
          - lambda:DeleteFunction
          - lambda:GetFunction
          - lambda:GetFunctionConfiguration
          - lambda:UpdateFunctionCode
          - lambda:UpdateFunctionConfiguration
          - lambda:AddPermission
          - lambda:RemovePermission
          - lambda:GetPolicy
          - lambda:TagResource
          - lambda:UntagResource
          - lambda:ListTags
          - lambda:PutFunctionConcurrency
          - lambda:DeleteFunctionConcurrency
          - lambda:GetFunctionConcurrency
          - lambda:InvokeFunction
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:amplify-${AmplifyAppId}-*
        - Effect: Allow
          Action:
          - iam:CreateRole
          - iam:PutRolePermissionsBoundary
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/amplify-${AmplifyAppId}-*
          Condition:
            ArnEquals:
              iam:PermissionsBoundary:
                Ref: RuntimeBoundary
        - Effect: Allow
          Action:
          - iam:GetRole
          - iam:DeleteRole
          - iam:UpdateRole
          - iam:UpdateRoleDescription
          - iam:UpdateAssumeRolePolicy
          - iam:TagRole
          - iam:UntagRole
          - iam:ListRoleTags
          - iam:ListRolePolicies
          - iam:GetRolePolicy
          - iam:PutRolePolicy
          - iam:DeleteRolePolicy
          - iam:ListAttachedRolePolicies
          - iam:AttachRolePolicy
          - iam:DetachRolePolicy
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/amplify-${AmplifyAppId}-*
        - Effect: Allow
          Action:
          - iam:PassRole
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/amplify-${AmplifyAppId}-*
          Condition:
            StringEquals:
              iam:PassedToService: lambda.amazonaws.com
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:DeleteLogGroup
          - logs:PutRetentionPolicy
          - logs:DeleteRetentionPolicy
          - logs:TagResource
          - logs:UntagResource
          - logs:ListTagsForResource
          - logs:TagLogGroup
          - logs:UntagLogGroup
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/amplify-${AmplifyAppId}-*
        - Effect: Allow
          Action:
          - logs:DescribeLogGroups
          Resource:
          - '*'
        - Effect: Allow
          Action:
          - apigateway:GET
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${ContactApi}
        - Effect: Allow
          Action:
          - apigateway:GET
          - apigateway:POST
          - apigateway:PATCH
          - apigateway:PUT
          - apigateway:DELETE
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${ContactApi}/*
        - Effect: Allow
          Action:
          - cloudwatch:PutMetricAlarm
          - cloudwatch:DeleteAlarms
          - cloudwatch:DescribeAlarms
          - cloudwatch:TagResource
          - cloudwatch:UntagResource
          - cloudwatch:ListTagsForResource
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:mac-web-${AmplifyAppId}-contact-*
        - Effect: Allow
          Action:
          - sns:CreateTopic
          - sns:DeleteTopic
          - sns:GetTopicAttributes
          - sns:SetTopicAttributes
          - sns:TagResource
          - sns:UntagResource
          - sns:ListTagsForResource
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:mac-web-${AmplifyAppId}-contact-alerts
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:GetObjectVersion
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::cdk-hnb659fds-assets-${AWS::AccountId}-${AWS::Region}/*
        - Effect: Allow
          Action:
          - ssm:GetParameter
          - ssm:GetParameters
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/hnb659fds/version
Outputs:
  ServiceRoleArn:
    Value:
      Fn::GetAtt:
      - AmplifyBackendRole
      - Arn
  ContactApiId:
    Value:
      Ref: ContactApi
  RuntimeBoundaryArn:
    Value:
      Ref: RuntimeBoundary
  DeploymentPolicyArn:
    Value:
      Ref: DeploymentExecutionPolicy
