AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions deployment role for the existing MAC Tecnologia Amplify app.

Parameters:
  AmplifyAppId:
    Type: String
    AllowedPattern: '^d[a-z0-9]{1,19}$'

Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:craguilar/mac-web:environment:production
      Policies:
        - PolicyName: DeployAmplifyMain
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: amplify:GetApp
                Resource: !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}'
              - Effect: Allow
                Action: [amplify:GetBranch, amplify:UpdateBranch, amplify:ListJobs]
                Resource: !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/main'
              - Effect: Allow
                Action: [amplify:StartJob, amplify:GetJob, amplify:StopJob]
                Resource: !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/main/jobs/*'

Outputs:
  RoleArn:
    Value: !GetAtt DeploymentRole.Arn
