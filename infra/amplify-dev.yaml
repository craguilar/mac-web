AWSTemplateFormatVersion: '2010-09-09'
Description: Private dev pipeline for the MAC Tecnologia static site on Amplify Hosting.

Parameters:
  ExistingAppId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^d[a-z0-9]{1,19}$'
    Description: ID of an Amplify app already connected to craguilar/mac-web. Leave empty to create one.
  GitHubTokenSecret:
    Type: String
    Default: ''
    Description: For a new app only, the name of a Secrets Manager secret containing the GitHub token as plain text.
  DevAccessSecret:
    Type: String
    MinLength: 1
    Description: Name of a Secrets Manager secret containing the JSON keys username and password for dev.
  ContinuousDeploy:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Enable deployments on pushes to the dev branch.

Rules:
  RequireTokenForNewApp:
    RuleCondition: !Equals [!Ref ExistingAppId, '']
    Assertions:
      - Assert: !Not [!Equals [!Ref GitHubTokenSecret, '']]
        AssertDescription: A new app requires a GitHub token secret.

Conditions:
  CreateApp: !Equals [!Ref ExistingAppId, '']
  DeployOnPush: !Equals [!Ref ContinuousDeploy, 'true']

Resources:
  HostingApp:
    Type: AWS::Amplify::App
    Condition: CreateApp
    Properties:
      Name: mac-web-dev
      Platform: WEB
      Repository: https://github.com/craguilar/mac-web
      AccessToken: !Sub '{{resolve:secretsmanager:${GitHubTokenSecret}:SecretString}}'

  DevBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !If [CreateApp, !GetAtt HostingApp.AppId, !Ref ExistingAppId]
      BranchName: dev
      Stage: DEVELOPMENT
      EnableAutoBuild: !If [DeployOnPush, true, false]
      EnablePullRequestPreview: false
      BasicAuthConfig:
        EnableBasicAuth: true
        Username: !Sub '{{resolve:secretsmanager:${DevAccessSecret}:SecretString:username}}'
        Password: !Sub '{{resolve:secretsmanager:${DevAccessSecret}:SecretString:password}}'
      EnvironmentVariables:
        - Name: MAC_AMPLIFY_CONTINUOUS_DEV
          Value: !Ref ContinuousDeploy

Outputs:
  AppId:
    Value: !If [CreateApp, !GetAtt HostingApp.AppId, !Ref ExistingAppId]
