# Amplify's GitHub connection builds and deploys main, including the Gen 2 backend.
version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 24
        - node scripts/check-deploy-branch.cjs
        - npm ci
        - npm run check
        - npm test
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
    build:
      commands:
        - npm run build -- --amplify
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
