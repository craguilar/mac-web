# Amplify runs this pipeline on the production branch. See infra/amplify-prod.yaml.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - node scripts/check-deploy-approval.cjs
    build:
      commands:
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
# No backend, credentials, dependency installation or cache is required.
