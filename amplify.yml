# Amplify builds and deploys main directly through its GitHub connection.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - node scripts/check-deploy-branch.cjs
    build:
      commands:
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
# No backend, credentials, dependency installation or cache is required.
