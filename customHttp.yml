# Language-query redirects must reach Amplify even after a canonical page is cached.
# Keep static assets cached; only the two HTML entry pages bypass caching.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self'; font-src 'self'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://mvxp0vhfuh.execute-api.us-east-2.amazonaws.com/contact https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; frame-src 'self' https://challenges.cloudflare.com; upgrade-insecure-requests"
  - pattern: '/'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/en/'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/en/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
